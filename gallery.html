<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<meta name="description" content="แกลเลอรี่รูปจากวาดเล่น รูปที่เส้นขยับได้เอง กดดูแล้วเอาไปวาดต่อได้">
<title>แกลเลอรี่ | วาดเล่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/shared.css">
<link rel="stylesheet" href="styles/lobby.css">
<link rel="stylesheet" href="styles/gallery.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="12" fill="#ff5a36"/><path id="logoLine" d="M9 27 C14 15, 19 31, 23 21 S31 12, 35 19" fill="none" stroke="#fffaf1" stroke-width="3.4" stroke-linecap="round"/></svg>
    <h1>วาดเล่น</h1>
  </a>
  <div class="top-r"><div class="lang-slot"></div>
  <a class="btn nav-gal" href="./" aria-label="ห้องวาด"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M7 4 3 8l4 4"/></svg><span class="nav-lbl">ห้องวาด</span></a>
  <a class="btn primary pop" href="draw.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></svg>
    <span class="solo-lbl">วาดคนเดียว</span>
  </a></div>
</header>

<main class="wrap">
  <section>
    <div class="rooms-head">
      <h3>แกลเลอรี่</h3>
      <button class="btn" id="refresh">โหลดใหม่</button>
    </div>
    <div class="seg" id="sort">
      <button data-s="new" class="on">ใหม่ล่าสุด</button>
      <button data-s="top">หัวใจเยอะสุด</button>
      <button data-s="mine">ของฉัน</button>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="gal" id="gal"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="empty" id="empty" hidden><div id="emptyText"></div><a class="btn primary pop" href="draw.html">ไปวาดรูปกัน</a></div>
    <div class="more"><button class="btn" id="more" hidden>ดูเพิ่ม</button></div>
    <p class="foot">กดที่รูปเพื่อดูเส้นขยับ และเอาไปวาดต่อได้</p>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="firebase-config.js"></script>
<script type="module" src="dist/gallery/main.js"></script>
</body>
</html>
