<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<meta name="description" content="วาดเล่น สมุดวาดรูปออนไลน์ เส้นที่วาดจะขยับได้เอง วาดคนเดียวหรือเปิดห้องวาดกับเพื่อนก็ได้">
<title>วาดเล่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="top">
  <a class="brand" href="./">
    <svg viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="12" fill="#ff5a36"/><path id="logoLine" d="M9 27 C14 15, 19 31, 23 21 S31 12, 35 19" fill="none" stroke="#fffaf1" stroke-width="3.4" stroke-linecap="round"/></svg>
    <h1>วาดเล่น</h1>
  </a>
  <div class="top-r"><div class="lang-slot"></div>
  <a class="btn nav-gal" href="gallery.html" aria-label="แกลเลอรี่"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="m2.5 11 3.2-3.2 2.6 2.6 1.7-1.7 3.5 3.5"/><circle cx="10.5" cy="5.8" r="1.1"/></svg><span class="nav-lbl">แกลเลอรี่</span></a>
  <a class="btn primary pop" href="draw.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></svg>
    <span class="solo-lbl">วาดคนเดียว</span>
  </a></div>
</header>

<main class="wrap">
  <section class="banner">
    <div class="b-text">
      <span class="kicker">สมุดวาดออนไลน์ ฟรี ไม่ต้องสมัคร</span>
      <h2>วาดเล่น</h2>
      <p>ชวนเพื่อนมาวาดเล่นกันเถอะ<br>เส้นยุกเส้นยิก เจ้าก้อนปุ๊กปิ๊ก ดุ๊กดิ๊ก ขยับได้!!!</p>
      <div class="b-cta">
        <a class="btn light" href="draw.html">เริ่มวาดเลย</a>
        <button class="btn ghost" id="openCreate">สร้างห้องวาดกับเพื่อน</button>
      </div>
    </div>
    <div class="b-art" aria-hidden="true">
      <svg viewBox="0 0 360 240">

        <path id="artPencil2" fill="none" stroke="#2a2420" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
        <path id="artPencil" fill="none" stroke="#2a2420" stroke-width="4.5" stroke-linecap="round"/>
        <g id="artPixel" fill="#3a86ff"></g>
        <path id="artWave" fill="none" stroke="#e63946" stroke-width="4" stroke-linejoin="miter" stroke-linecap="round"/>
      </svg>
    </div>
  </section>

  <section>
    <div class="rooms-head">
      <h3>ห้องที่เปิดอยู่ <span id="count"></span></h3>
      <form class="join" id="joinForm" autocomplete="off">
        <input class="input code-in" id="codeInput" maxlength="6" placeholder="มีรหัสห้อง?" autocapitalize="characters" spellcheck="false" aria-label="รหัสห้อง">
        <button class="btn" type="submit">เข้า</button>
      </form>
    </div>
    <div class="seg" id="filter">
      <button data-f="all" class="on">ทั้งหมด</button>
      <button data-f="public">สาธารณะ</button>
      <button data-f="private">ส่วนตัว</button>
      <button data-f="mine">ของฉัน</button>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
    <div class="empty" id="empty" hidden>
      <div id="emptyText"></div>
      <button class="btn primary pop" id="emptyCreate">สร้างห้องแรก</button>
    </div>
    <p class="foot">ห้องละ 2 คน ทุกห้องจะหายเองเมื่อครบ 3 วันหลังสร้าง</p>
  </section>
</main>

<div class="modal" id="createModal" role="dialog" aria-labelledby="createTitle">
  <div class="card">
    <div class="card-head">
      <h3 id="createTitle">สร้างห้องใหม่</h3>
      <button class="xbtn" id="closeCreate" aria-label="ปิด"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <label class="field">ชื่อห้อง
      <input class="input" id="nameInput" maxlength="30" placeholder="เช่น ห้องวาดแมว" autocomplete="off">
    </label>
    <div class="vis" id="vis">
      <button data-vis="public" class="on" type="button">สาธารณะ</button>
      <button data-vis="private" type="button">ส่วนตัว</button>
    </div>
    <p class="note" id="visNote">ทุกคนเห็นในรายการและกดเข้าได้ทันที</p>
    <button class="btn primary big" id="createBtn">สร้างห้อง</button>
    <div class="msg" id="createMsg" hidden></div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module" src="dist/lobby/main.js"></script>
</body>
</html>
