<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<meta name="description" content="ยุกยิก สมุดวาดรูปออนไลน์ เส้นที่วาดจะขยับได้เอง วาดคนเดียวหรือเปิดห้องวาดกับเพื่อนก็ได้">
<title>ยุกยิก สมุดวาดเส้นขยับได้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece4d6;--panel:#fffaf1;--ink:#2a2420;--muted:#8c8071;--line:#e4d8c5;--accent:#ff5a36;--accent-soft:#ffe6dc;--chip:#f4ecdf}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:'Mali',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 14px max(18px, env(safe-area-inset-left));
  background:var(--panel);border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:42px;height:42px;flex:none}
.brand h1{font-size:22px;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;
  font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s;touch-action:manipulation}
.btn:hover{border-color:#c9b79c}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.big{width:100%;padding:13px;font-size:15px}
.btn.danger{color:#b4321a;border-color:#f0c5b9}
.btn.danger.confirm{background:#b4321a;color:#fff;border-color:#b4321a}
.btn svg{width:16px;height:16px;flex:none}
.pop{box-shadow:2px 2px 0 var(--ink);border-color:var(--ink)}

.wrap{max-width:1040px;margin:0 auto;padding:26px max(18px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left))}
.hero h2{font-size:28px;margin:0 0 4px}
.hero p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.6}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.card h3{margin:0 0 12px;font-size:17px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.input{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;outline:none}
.input:focus{border-color:var(--ink)}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.vis button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;touch-action:manipulation}
.vis button small{font-size:11.5px;color:var(--muted)}
.vis button.on{border-color:var(--ink);background:var(--accent-soft);box-shadow:2px 2px 0 var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.join{display:flex;gap:8px}
.code-in{letter-spacing:.3em;text-transform:uppercase;font-weight:600;text-align:center;font-size:18px}
.code-in::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;text-transform:none}
.msg{background:#fff1ec;color:#a3361b;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.5}
.msg[hidden]{display:none}

.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.list-head h3{margin:0}
.list-head h3 span{color:var(--muted);font-weight:400;font-size:14px}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;touch-action:manipulation}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(60,40,20,.18);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.room{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.room.mine{border-color:#e9c9a6}
.r-name{font-weight:600;font-size:15.5px;word-break:break-word}
.r-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:4px;align-items:center}
.r-meta span{display:inline-flex;align-items:center;gap:4px}
.r-meta svg{width:14px;height:14px}
.tag{border-radius:999px;padding:1px 9px;background:#e8f1fb;color:#2b5d94;font-size:11.5px}
.tag.private{background:#f6ead9;color:#8a5a1c}
.tag.me{background:var(--accent-soft);color:#b8401f}
.full{color:#b4321a}
.r-act{display:flex;gap:6px}
.r-key{grid-column:1 / -1;display:flex;gap:8px}
.r-key[hidden]{display:none}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14.5px;line-height:1.7}
.empty[hidden]{display:none}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,#f3ece0 25%,#faf5ec 50%,#f3ece0 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .hero h2{font-size:24px}
}
@media (max-width:480px){
  .top .solo-lbl{display:none}
  .brand small{display:none}
  .room{grid-template-columns:1fr}
  .r-act{justify-content:stretch}
  .r-act .btn{flex:1}
  .list-head .seg{width:100%}
  .list-head .seg button{flex:1;padding:6px 4px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="12" fill="#ff5a36"/><path id="logoLine" d="M9 27 C14 15, 19 31, 23 21 S31 12, 35 19" fill="none" stroke="#fffaf1" stroke-width="3.4" stroke-linecap="round"/></svg>
    <div><h1>ยุกยิก</h1><small>สมุดวาดเส้นที่ขยับได้เอง</small></div>
  </a>
  <a class="btn primary pop" href="draw.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></svg>
    <span class="solo-lbl">วาดคนเดียว</span>
  </a>
</header>

<main class="wrap">
  <section class="hero">
    <h2>วาดกับเพื่อน</h2>
    <p>สร้างห้องใหม่ หรือเลือกห้องที่มีอยู่ ห้องละ 2 คน ทุกห้องจะหายเองเมื่อครบ 3 วันหลังสร้าง<br>อยากวาดคนเดียวกด “วาดคนเดียว” ได้เลย ไม่ต้องสร้างห้อง</p>
  </section>

  <div class="grid">
    <div class="col">
      <section class="card">
        <h3>สร้างห้องใหม่</h3>
        <label class="field">ชื่อห้อง
          <input class="input" id="nameInput" maxlength="30" placeholder="เช่น ห้องวาดแมว" autocomplete="off">
        </label>
        <div class="vis" id="vis">
          <button data-vis="public" class="on" type="button">สาธารณะ<small>ใครก็กดเข้าได้</small></button>
          <button data-vis="private" type="button">ส่วนตัว<small>ต้องมีรหัสผ่าน</small></button>
        </div>
        <button class="btn primary big" id="createBtn">สร้างห้อง</button>
        <p class="note" id="visNote">ห้องสาธารณะ ทุกคนเห็นในรายการและกดเข้าได้ทันที</p>
      </section>

      <section class="card">
        <h3>มีรหัสห้องแล้ว</h3>
        <form class="join" id="joinForm" autocomplete="off">
          <input class="input code-in" id="codeInput" maxlength="6" placeholder="รหัสห้อง 6 ตัว" autocapitalize="characters" spellcheck="false" aria-label="รหัสห้อง">
          <button class="btn" type="submit">เข้าห้อง</button>
        </form>
      </section>

      <div class="msg" id="msg" hidden></div>
    </div>

    <section class="card">
      <div class="list-head">
        <h3>ห้องทั้งหมด <span id="count"></span></h3>
        <div class="seg" id="filter">
          <button data-f="all" class="on">ทั้งหมด</button>
          <button data-f="public">สาธารณะ</button>
          <button data-f="private">ส่วนตัว</button>
          <button data-f="mine">ของฉัน</button>
        </div>
      </div>
      <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
      <div class="empty" id="empty" hidden></div>
    </section>
  </div>
</main>

<script src="firebase-config.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const FB_VER = '12.4.0';
const CODE_CHARS = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const CODE_RE = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$/;
const ROOM_TTL = 3 * 24 * 60 * 60 * 1000;
const MYKEYS = 'yukyik-mykeys';

const st = {fb:null, db:null, uid:null, rooms:{}, counts:{}, slotUnsubs:{}, filter:'all', vis:'public', busy:false, cleaned:new Set(), confirmDel:null, openKey:{}};

const ICON_PEOPLE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13.5c.4-2.4 2.1-3.8 4.2-3.8s3.8 1.4 4.2 3.8"/><circle cx="11.3" cy="5" r="1.8"/><path d="M11.6 9.3c1.5.2 2.4 1.4 2.7 3.2"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>';

/* ---------- ทั่วไป ---------- */
function fbConfig(){
  const c = window.FIREBASE_CONFIG;
  if (!c || typeof c !== 'object' || !c.apiKey || !c.databaseURL || String(c.apiKey).includes('ใส่')) return null;
  return c;
}
function genCode(){ const a = new Uint32Array(6); crypto.getRandomValues(a); return Array.from(a, n => CODE_CHARS[n % CODE_CHARS.length]).join(''); }
function myKeys(){ try { return JSON.parse(localStorage.getItem(MYKEYS) || '{}') || {}; } catch (_) { return {}; } }
function saveKey(code, key){ try { const k = myKeys(); k[code] = key; localStorage.setItem(MYKEYS, JSON.stringify(k)); } catch (_) {} }
function leftText(ms){
  if (ms <= 0) return 'หมดอายุแล้ว';
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
  if (d >= 1) return `หายในอีก ${d} วัน ${h % 24} ชม.`;
  if (h >= 1) return `หายในอีก ${h} ชม.`;
  return `หายในอีก ${Math.max(1, Math.ceil(ms / 60000))} นาที`;
}
const ERR = {
  'no-config':'ยังไม่ได้ตั้งค่า Firebase จึงยังเปิดห้องไม่ได้ ดูวิธีตั้งค่าในไฟล์ README.md (วาดคนเดียวใช้ได้ตามปกติ)',
  'auth':'ยังไม่ได้เปิดการเข้าใช้แบบไม่ระบุตัวตน (Anonymous) ใน Firebase',
  'domain':'โดเมนของเว็บนี้ยังไม่ได้รับอนุญาตใน Firebase (Authorized domains)',
  'denied':'ฐานข้อมูลไม่อนุญาต ลองเช็กว่าใส่ Security Rules ชุดล่าสุดแล้วหรือยัง',
  'bad-code':'รหัสห้องต้องมี 6 ตัว',
  'busy':'สร้างห้องไม่สำเร็จ ลองใหม่อีกครั้ง',
  'net':'เชื่อมต่อไม่ได้ ลองเช็กอินเทอร์เน็ตแล้วลองใหม่'
};
function errKey(err){
  const c = String((err && (err.code || err.message)) || '');
  if (ERR[c]) return c;
  if (/operation-not-allowed|admin-restricted|configuration-not-found/.test(c)) return 'auth';
  if (/unauthorized-domain|requests-from-referer/.test(c)) return 'domain';
  if (/permission|PERMISSION_DENIED/i.test(c)) return 'denied';
  return 'net';
}
function showMsg(k){ const m = $('#msg'); m.textContent = k ? (ERR[k] || k) : ''; m.hidden = !k; }

/* ---------- Firebase ---------- */
async function ensureFirebase(){
  if (st.fb) return st.fb;
  const cfg = fbConfig(); if (!cfg) throw {code:'no-config'};
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, authM, dbM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]);
  const app = appM.initializeApp(cfg);
  const cred = await authM.signInAnonymously(authM.getAuth(app));
  st.uid = cred.user.uid; st.db = dbM.getDatabase(app); st.fb = dbM;
  return dbM;
}
const R = p => st.fb.ref(st.db, p);

/* ---------- รายการห้อง ---------- */
function watchList(){
  const fb = st.fb;
  const q = fb.query(R('lobby'), fb.orderByChild('createdAt'), fb.limitToLast(100));
  fb.onValue(q, snap => {
    const v = snap.val() || {};
    st.rooms = {};
    for (const [code, r] of Object.entries(v)){
      if (!CODE_RE.test(code) || !r || typeof r !== 'object') continue;
      st.rooms[code] = {
        code, name:typeof r.name === 'string' ? r.name.slice(0, 40) : 'ห้องไม่มีชื่อ',
        private:r.private === true, owner:typeof r.owner === 'string' ? r.owner : '',
        createdAt:typeof r.createdAt === 'number' ? r.createdAt : 0
      };
    }
    syncCounts(); cleanup(); render();
  }, err => { console.warn(err); showMsg(errKey(err)); $('#list').innerHTML = ''; });
}
// นับคนในแต่ละห้อง
function syncCounts(){
  for (const code of Object.keys(st.slotUnsubs)){
    if (!st.rooms[code]){ st.slotUnsubs[code](); delete st.slotUnsubs[code]; delete st.counts[code]; }
  }
  for (const code of Object.keys(st.rooms)){
    if (st.slotUnsubs[code]) continue;
    st.slotUnsubs[code] = st.fb.onValue(R(`rooms/${code}/slots`), snap => {
      st.counts[code] = Object.values(snap.val() || {}).filter(Boolean).length;
      render();
    }, () => {});
  }
}
// ลบห้องที่ครบ 3 วัน (ใครเปิดหน้านี้ก็ช่วยลบได้ กฎของฐานข้อมูลยอมให้ลบเฉพาะห้องที่หมดอายุ)
function cleanup(){
  const now = Date.now();
  for (const r of Object.values(st.rooms)){
    if (now < r.createdAt + ROOM_TTL || st.cleaned.has(r.code)) continue;
    st.cleaned.add(r.code);
    deleteRoom(r.code).catch(err => console.warn('cleanup', r.code, err));
  }
}
function deleteRoom(code){
  return st.fb.update(R('/'), {[`rooms/${code}`]:null, [`lobby/${code}`]:null, [`secrets/${code}`]:null});
}
function render(){
  const list = $('#list'), now = Date.now();
  const ae = document.activeElement, focusKey = ae && ae.closest && ae.closest('[data-key-for]') ? ae.closest('[data-key-for]').dataset.keyFor : null;
  const all = Object.values(st.rooms).filter(r => now < r.createdAt + ROOM_TTL).sort((a, b) => b.createdAt - a.createdAt);
  const shown = all.filter(r => st.filter === 'all' || (st.filter === 'public' && !r.private) || (st.filter === 'private' && r.private) || (st.filter === 'mine' && r.owner === st.uid));
  $('#count').textContent = all.length ? `(${all.length})` : '';
  list.textContent = '';
  const keys = myKeys();
  for (const r of shown){
    const mine = r.owner === st.uid, n = st.counts[r.code] || 0, full = n >= 2;
    const el = document.createElement('div'); el.className = 'room' + (mine ? ' mine' : '');
    const main = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'r-name'; nm.textContent = r.name;
    const meta = document.createElement('div'); meta.className = 'r-meta';
    const tag = document.createElement('span'); tag.className = 'tag' + (r.private ? ' private' : ''); tag.textContent = r.private ? 'ส่วนตัว' : 'สาธารณะ';
    const ppl = document.createElement('span'); ppl.innerHTML = ICON_PEOPLE; ppl.append(` ${n}/2`); if (full) ppl.classList.add('full');
    const tm = document.createElement('span'); tm.innerHTML = ICON_CLOCK; tm.append(' ' + leftText(r.createdAt + ROOM_TTL - now));
    meta.append(tag, ppl, tm);
    if (mine){ const me = document.createElement('span'); me.className = 'tag me'; me.textContent = 'ห้องของคุณ'; meta.append(me); }
    if (!r.private){ const c = document.createElement('span'); c.textContent = 'รหัส ' + r.code; meta.append(c); }
    main.append(nm, meta);

    const act = document.createElement('div'); act.className = 'r-act';
    const go = document.createElement('button'); go.className = 'btn primary';
    const myKey = keys[r.code];
    go.textContent = full ? 'เต็มแล้ว' : (r.private && !(mine && myKey) ? 'ใส่รหัสผ่าน' : 'เข้าห้อง');
    go.disabled = full;
    act.append(go);
    let keyRow = null;
    if (r.private && !(mine && myKey)){
      keyRow = document.createElement('form'); keyRow.className = 'r-key'; keyRow.hidden = !(r.code in st.openKey);
      const inp = document.createElement('input'); inp.className = 'input code-in'; inp.maxLength = 6; inp.placeholder = 'รหัสผ่าน 6 ตัว';
      inp.autocapitalize = 'characters'; inp.spellcheck = false; inp.value = st.openKey[r.code] || '';
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6); st.openKey[r.code] = inp.value; });
      const ok = document.createElement('button'); ok.className = 'btn'; ok.type = 'submit'; ok.textContent = 'เข้า';
      keyRow.append(inp, ok);
      keyRow.addEventListener('submit', e => {
        e.preventDefault();
        if (!CODE_RE.test(inp.value)){ showMsg('รหัสผ่านต้องมี 6 ตัว'); return; }
        location.href = `draw.html?room=${r.code}&key=${inp.value}`;
      });
      go.addEventListener('click', () => {
        if (r.code in st.openKey){ delete st.openKey[r.code]; } else st.openKey[r.code] = '';
        render(); const f = document.querySelector(`[data-key-for="${r.code}"] input`); if (f) f.focus();
      });
      keyRow.dataset.keyFor = r.code;
    } else {
      go.addEventListener('click', () => { location.href = `draw.html?room=${r.code}` + (r.private && myKey ? `&key=${myKey}` : ''); });
    }
    if (mine){
      const del = document.createElement('button'); del.className = 'btn danger';
      const confirming = st.confirmDel === r.code;
      del.textContent = confirming ? 'ยืนยันลบ' : 'ลบห้อง';
      if (confirming) del.classList.add('confirm');
      del.addEventListener('click', async () => {
        if (st.confirmDel !== r.code){
          st.confirmDel = r.code; render();
          setTimeout(() => { if (st.confirmDel === r.code){ st.confirmDel = null; render(); } }, 3000);
          return;
        }
        st.confirmDel = null; del.disabled = true; del.textContent = 'กำลังลบ';
        try { await deleteRoom(r.code); showMsg(null); } catch (err) { console.warn(err); showMsg(errKey(err)); render(); }
      });
      act.append(del);
    }
    el.append(main, act);
    if (keyRow) el.append(keyRow);
    list.append(el);
  }
  if (focusKey){ const f = list.querySelector(`[data-key-for="${focusKey}"] input`); if (f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  const empty = $('#empty');
  empty.hidden = shown.length > 0;
  empty.textContent = all.length === 0 ? 'ยังไม่มีห้อง ลองสร้างห้องแรกดูเลย' : 'ไม่มีห้องในหมวดนี้';
}

/* ---------- สร้างห้อง ---------- */
async function createRoom(){
  const fb = await ensureFirebase();
  const name = $('#nameInput').value.replace(/\s+/g, ' ').trim().slice(0, 30) || 'ห้องวาดเล่น';
  const priv = st.vis === 'private';
  for (let i = 0; i < 6; i++){
    const code = genCode();
    if ((await fb.get(R(`rooms/${code}/meta`))).exists()) continue;
    const TS = fb.serverTimestamp(), upd = {};
    upd[`rooms/${code}/meta`] = {createdAt:TS, owner:st.uid, name, private:priv};
    upd[`lobby/${code}`] = {createdAt:TS, owner:st.uid, name, private:priv};
    let key = null;
    if (priv){
      key = genCode();
      upd[`secrets/${code}`] = key;
      upd[`rooms/${code}/keys/${st.uid}`] = key;
    }
    await fb.update(R('/'), upd);
    if (key) saveKey(code, key);
    location.href = `draw.html?room=${code}` + (key ? `&key=${key}` : '');
    return;
  }
  throw {code:'busy'};
}

/* ---------- UI ---------- */
document.querySelectorAll('#vis button').forEach(b => b.addEventListener('click', () => {
  st.vis = b.dataset.vis;
  document.querySelectorAll('#vis button').forEach(x => x.classList.toggle('on', x === b));
  $('#visNote').textContent = st.vis === 'private'
    ? 'ห้องส่วนตัว คนอื่นเห็นชื่อห้องในรายการ แต่ต้องมีรหัสผ่านถึงจะเข้าได้ ระบบจะสุ่มรหัสผ่านให้'
    : 'ห้องสาธารณะ ทุกคนเห็นในรายการและกดเข้าได้ทันที';
}));
document.querySelectorAll('#filter button').forEach(b => b.addEventListener('click', () => {
  st.filter = b.dataset.f;
  document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('on', x === b));
  render();
}));
$('#createBtn').addEventListener('click', async () => {
  if (st.busy) return;
  st.busy = true; showMsg(null);
  const b = $('#createBtn'); b.disabled = true; b.textContent = 'กำลังสร้างห้อง';
  try { await createRoom(); }
  catch (err) { console.warn(err); showMsg(errKey(err)); b.disabled = false; b.textContent = 'สร้างห้อง'; }
  finally { st.busy = false; }
});
$('#codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6); });
$('#joinForm').addEventListener('submit', e => {
  e.preventDefault();
  const code = $('#codeInput').value;
  if (!CODE_RE.test(code)){ showMsg('bad-code'); return; }
  location.href = 'draw.html?room=' + code;
});

// โลโก้ขยับ
const logo = $('#logoLine');
const frames = ['M9 27 C14 15, 19 31, 23 21 S31 12, 35 19','M9 26 C15 16, 18 30, 23 22 S30 13, 35 18','M10 27 C14 14, 20 30, 22 21 S31 11, 34 19'];
let li = 0; setInterval(() => { li = (li + 1) % 3; logo.setAttribute('d', frames[li]); }, 120);

/* ---------- เริ่ม ---------- */
(async () => {
  if (!fbConfig()){
    showMsg('no-config'); $('#list').textContent = '';
    $('#createBtn').disabled = true;
    const e = $('#empty'); e.hidden = false; e.textContent = 'ยังดูรายการห้องไม่ได้ ระหว่างนี้กด “วาดคนเดียว” ได้เลย';
    return;
  }
  try { await ensureFirebase(); watchList(); }
  catch (err) { console.warn(err); showMsg(errKey(err)); $('#list').textContent = ''; }
  setInterval(() => { cleanup(); render(); }, 30000);   // อัปเดตเวลานับถอยหลัง
})();
})();
</script>
