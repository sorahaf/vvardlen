<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<meta name="description" content="วาดเล่น สมุดวาดรูปออนไลน์ เส้นที่วาดจะขยับได้เอง วาดคนเดียวหรือเปิดห้องวาดกับเพื่อนก็ได้">
<title>วาดเล่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece4d6;--panel:#fffaf1;--ink:#2a2420;--muted:#8c8071;--line:#e4d8c5;--accent:#ff5a36;--accent-soft:#ffe6dc;--chip:#f4ecdf}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:'Mali',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 12px max(18px, env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{font-size:21px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;
  font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s,transform .15s;touch-action:manipulation}
.btn:hover{border-color:#c9b79c}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.big{width:100%;padding:13px;font-size:15px}
.btn.danger{color:#b4321a;border-color:#f0c5b9}
.btn.danger.confirm{background:#b4321a;color:#fff;border-color:#b4321a}
.btn svg{width:16px;height:16px;flex:none}
.pop{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.pop:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

.wrap{max-width:980px;margin:0 auto;padding:6px max(18px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left))}

/* แบนเนอร์ */
.banner{position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px;background:var(--accent);color:#fffaf1;
  border:1.5px solid var(--ink);border-radius:26px;box-shadow:4px 4px 0 var(--ink);padding:34px 34px 34px 38px;margin-bottom:30px}
.banner::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.4px, transparent 1.6px);background-size:22px 22px;pointer-events:none}
.b-text{position:relative}
.kicker{display:inline-block;font-size:12.5px;font-weight:600;background:rgba(255,250,241,.2);border:1px solid rgba(255,250,241,.45);border-radius:999px;padding:3px 12px}
.banner h2{font-size:54px;line-height:1.1;margin:14px 0 8px}
.banner p{margin:0 0 22px;font-size:16.5px;line-height:1.65;opacity:.95}
.b-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn.light{background:#fffaf1;color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:15px;padding:11px 18px}
.btn.light:hover{background:#fff}
.btn.ghost{background:transparent;color:#fffaf1;border-color:rgba(255,250,241,.7);font-size:15px;padding:11px 18px}
.btn.ghost:hover{background:rgba(255,250,241,.14);border-color:#fffaf1}
.b-art{position:relative;background:#fffaf1;border:1.5px solid var(--ink);border-radius:18px;transform:rotate(2deg);box-shadow:3px 3px 0 var(--ink)}
.b-art svg{display:block;width:100%;height:auto}

/* รายการห้อง */
.rooms-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rooms-head h3{margin:0;font-size:20px}
.rooms-head h3 span{color:var(--muted);font-weight:400;font-size:15px}
.join{display:flex;gap:6px}
.input{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;font-size:16px;outline:none}
.input:focus{border-color:var(--ink)}
.code-in{letter-spacing:.25em;text-transform:uppercase;font-weight:600;text-align:center}
.code-in::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;text-transform:none}
.join .input{width:170px}
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;touch-action:manipulation}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(60,40,20,.18);font-weight:600}
.msg{background:#fff1ec;color:#a3361b;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.msg[hidden]{display:none}
.list{display:grid;grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));gap:20px 14px;padding-top:6px}
.room{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:border-color .15s}
.room:hover{border-color:#cdbb9f}
.room.mine{border-color:#ecc5a2}
.r-name{font-weight:600;font-size:16px;word-break:break-word}
.r-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:5px;align-items:center}
.r-meta span{display:inline-flex;align-items:center;gap:4px}
.r-meta svg{width:14px;height:14px}
.tag{border-radius:999px;padding:1px 9px;background:#e8f1fb;color:#2b5d94;font-size:11.5px}
.tag.private{background:#f6ead9;color:#8a5a1c}
.tag.me{background:var(--accent-soft);color:#b8401f}
.full{color:#b4321a}
.r-act{display:flex;gap:6px}
.r-act .btn{flex:1}
.r-key{display:flex;gap:8px}
.r-key[hidden]{display:none}
.empty{text-align:center;color:var(--muted);padding:38px 16px;font-size:15px;line-height:1.7;background:var(--panel);border:1.5px dashed var(--line);border-radius:18px}
.empty[hidden]{display:none}
.empty .btn{margin-top:12px}
.empty .btn[hidden]{display:none}
.skel{height:108px;border-radius:16px;background:linear-gradient(90deg,#f3ece0 25%,#faf5ec 50%,#f3ece0 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:26px 0 0}

/* หน้าต่างสร้างห้อง */
.modal{position:fixed;inset:0;background:rgba(30,22,15,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
.modal.show{display:flex}
.card{background:var(--panel);border-radius:20px;padding:20px;width:min(400px,100%);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-head h3{margin:0;font-size:18px}
.xbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.vis button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;font-size:14px;touch-action:manipulation}
.vis button.on{border-color:var(--ink);background:var(--accent-soft);box-shadow:2px 2px 0 var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5;min-height:1.5em}
.card .msg{margin:12px 0 0}

@media (max-width:760px){
  .banner{grid-template-columns:1fr;padding:26px 22px 24px;gap:22px;border-radius:22px}
  .banner h2{font-size:42px}
  .banner p{font-size:15px}
  .b-art{transform:rotate(1.5deg);width:100%;max-width:340px;justify-self:center}
  .b-cta .btn{flex:1}
}
@media (max-width:480px){
  .brand h1{font-size:19px}
  .top .solo-lbl{display:none}
  .rooms-head{flex-direction:column;align-items:stretch}
  .join .input{width:auto;flex:1}
  .seg{display:flex}
  .seg button{flex:1;padding:6px 4px}
  .list{grid-template-columns:1fr}
}

/* ---------- ลุคสมุดโน้ต (แต่งเล็กน้อย) ---------- */
.btn,.room{border-radius:13px 16px 12px 17px/16px 12px 17px 13px}
.btn{transition:border-color .15s,background .15s,transform .1s}
.btn:active:not(:disabled){transform:translate(1px,1px) scale(.97)}
.room{position:relative;transition:border-color .15s,transform .2s}
.room:hover{transform:rotate(-.6deg)}
.room:nth-child(even):hover{transform:rotate(.6deg)}
.room::before{content:'';position:absolute;top:-9px;left:50%;width:64px;height:18px;margin-left:-32px;transform:rotate(-3deg);
  background:rgba(255,232,160,.75);box-shadow:0 1px 2px rgba(60,40,20,.12);pointer-events:none}
.room:nth-child(3n+2)::before{transform:rotate(2.5deg);background:rgba(190,225,255,.7)}
.room:nth-child(3n)::before{transform:rotate(-1deg);background:rgba(255,200,210,.7)}
@media (prefers-reduced-motion:reduce){.room:hover,.btn:active{transform:none}}
</style>
</head>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const FB_VER = '12.4.0';
const CODE_CHARS = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const CODE_RE = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$/;
const ROOM_TTL = 3 * 24 * 60 * 60 * 1000;
const MYKEYS = 'yukyik-mykeys';

const st = {fb:null, db:null, uid:null, rooms:{}, counts:{}, slotUnsubs:{}, filter:'all', vis:'public', busy:false, cleaned:new Set(), confirmDel:null, openKey:{}};

const ICON_PEOPLE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13.5c.4-2.4 2.1-3.8 4.2-3.8s3.8 1.4 4.2 3.8"/><circle cx="11.3" cy="5" r="1.8"/><path d="M11.6 9.3c1.5.2 2.4 1.4 2.7 3.2"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>';

/* ---------- ทั่วไป ---------- */
function fbConfig(){
  const c = window.FIREBASE_CONFIG;
  if (!c || typeof c !== 'object' || !c.apiKey || !c.databaseURL || String(c.apiKey).includes('ใส่')) return null;
  return c;
}
function genCode(){ const a = new Uint32Array(6); crypto.getRandomValues(a); return Array.from(a, n => CODE_CHARS[n % CODE_CHARS.length]).join(''); }
function myKeys(){ try { return JSON.parse(localStorage.getItem(MYKEYS) || '{}') || {}; } catch (_) { return {}; } }
function saveKey(code, key){ try { const k = myKeys(); k[code] = key; localStorage.setItem(MYKEYS, JSON.stringify(k)); } catch (_) {} }
function leftText(ms){
  if (ms <= 0) return 'หมดอายุแล้ว';
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
  if (d >= 1) return `หายในอีก ${d} วัน ${h % 24} ชม.`;
  if (h >= 1) return `หายในอีก ${h} ชม.`;
  return `หายในอีก ${Math.max(1, Math.ceil(ms / 60000))} นาที`;
}
const ERR = {
  'no-config':'ยังไม่ได้ตั้งค่า Firebase จึงยังเปิดห้องไม่ได้ ดูวิธีตั้งค่าในไฟล์ README.md (วาดคนเดียวใช้ได้ตามปกติ)',
  'auth':'ยังไม่ได้เปิดการเข้าใช้แบบไม่ระบุตัวตน (Anonymous) ใน Firebase',
  'domain':'โดเมนของเว็บนี้ยังไม่ได้รับอนุญาตใน Firebase (Authorized domains)',
  'denied':'ฐานข้อมูลไม่อนุญาต ลองเช็กว่าใส่ Security Rules ชุดล่าสุดแล้วหรือยัง',
  'bad-code':'รหัสห้องต้องมี 6 ตัว',
  'busy':'สร้างห้องไม่สำเร็จ ลองใหม่อีกครั้ง',
  'net':'เชื่อมต่อไม่ได้ ลองเช็กอินเทอร์เน็ตแล้วลองใหม่'
};
function errKey(err){
  const c = String((err && (err.code || err.message)) || '');
  if (ERR[c]) return c;
  if (/operation-not-allowed|admin-restricted|configuration-not-found/.test(c)) return 'auth';
  if (/unauthorized-domain|requests-from-referer/.test(c)) return 'domain';
  if (/permission|PERMISSION_DENIED/i.test(c)) return 'denied';
  return 'net';
}
function showMsg(k, where = '#msg'){ const m = $(where); m.textContent = k ? (ERR[k] || k) : ''; m.hidden = !k; }
function openCreate(){
  showMsg(fbConfig() ? null : 'no-config', '#createMsg');
  $('#createModal').classList.add('show');
  setTimeout(() => $('#nameInput').focus(), 50);
}
function closeCreate(){ $('#createModal').classList.remove('show'); }

/* ---------- Firebase ---------- */
async function ensureFirebase(){
  if (st.fb) return st.fb;
  const cfg = fbConfig(); if (!cfg) throw {code:'no-config'};
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, authM, dbM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]);
  const app = appM.initializeApp(cfg);
  const cred = await authM.signInAnonymously(authM.getAuth(app));
  st.uid = cred.user.uid; st.db = dbM.getDatabase(app); st.fb = dbM;
  return dbM;
}
const R = p => st.fb.ref(st.db, p);

/* ---------- รายการห้อง ---------- */
function watchList(){
  const fb = st.fb;
  const q = fb.query(R('lobby'), fb.orderByChild('createdAt'), fb.limitToLast(100));
  fb.onValue(q, snap => {
    const v = snap.val() || {};
    st.rooms = {};
    for (const [code, r] of Object.entries(v)){
      if (!CODE_RE.test(code) || !r || typeof r !== 'object') continue;
      st.rooms[code] = {
        code, name:typeof r.name === 'string' ? r.name.slice(0, 40) : 'ห้องไม่มีชื่อ',
        private:r.private === true, owner:typeof r.owner === 'string' ? r.owner : '',
        createdAt:typeof r.createdAt === 'number' ? r.createdAt : 0
      };
    }
    syncCounts(); cleanup(); render();
  }, err => { console.warn(err); showMsg(errKey(err)); $('#list').innerHTML = ''; });
}
// นับคนในแต่ละห้อง
function syncCounts(){
  for (const code of Object.keys(st.slotUnsubs)){
    if (!st.rooms[code]){ st.slotUnsubs[code](); delete st.slotUnsubs[code]; delete st.counts[code]; }
  }
  for (const code of Object.keys(st.rooms)){
    if (st.slotUnsubs[code]) continue;
    st.slotUnsubs[code] = st.fb.onValue(R(`rooms/${code}/slots`), snap => {
      st.counts[code] = Object.values(snap.val() || {}).filter(Boolean).length;
      render();
    }, () => {});
  }
}
// ลบห้องที่ครบ 3 วัน (ใครเปิดหน้านี้ก็ช่วยลบได้ กฎของฐานข้อมูลยอมให้ลบเฉพาะห้องที่หมดอายุ)
function cleanup(){
  const now = Date.now();
  for (const r of Object.values(st.rooms)){
    if (now < r.createdAt + ROOM_TTL || st.cleaned.has(r.code)) continue;
    st.cleaned.add(r.code);
    deleteRoom(r.code).catch(err => console.warn('cleanup', r.code, err));
  }
}
function deleteRoom(code){
  try { const k = myKeys(); if (code in k){ delete k[code]; localStorage.setItem(MYKEYS, JSON.stringify(k)); } } catch (_) {}
  return st.fb.update(R('/'), {[`rooms/${code}`]:null, [`lobby/${code}`]:null, [`secrets/${code}`]:null});
}
function render(){
  const list = $('#list'), now = Date.now();
  const ae = document.activeElement, focusKey = ae && ae.closest && ae.closest('[data-key-for]') ? ae.closest('[data-key-for]').dataset.keyFor : null;
  const all = Object.values(st.rooms).filter(r => now < r.createdAt + ROOM_TTL).sort((a, b) => b.createdAt - a.createdAt);
  const shown = all.filter(r => st.filter === 'all' || (st.filter === 'public' && !r.private) || (st.filter === 'private' && r.private) || (st.filter === 'mine' && r.owner === st.uid));
  $('#count').textContent = all.length ? `(${all.length})` : '';
  list.textContent = '';
  const keys = myKeys();
  for (const r of shown){
    const mine = r.owner === st.uid, n = st.counts[r.code] || 0, full = n >= 2;
    const el = document.createElement('div'); el.className = 'room' + (mine ? ' mine' : '');
    const main = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'r-name'; nm.textContent = r.name;
    const meta = document.createElement('div'); meta.className = 'r-meta';
    const tag = document.createElement('span'); tag.className = 'tag' + (r.private ? ' private' : ''); tag.textContent = r.private ? 'ส่วนตัว' : 'สาธารณะ';
    const ppl = document.createElement('span'); ppl.innerHTML = ICON_PEOPLE; ppl.append(` ${n}/2`); if (full) ppl.classList.add('full');
    const tm = document.createElement('span'); tm.innerHTML = ICON_CLOCK; tm.append(' ' + leftText(r.createdAt + ROOM_TTL - now));
    meta.append(tag, ppl, tm);
    if (mine){ const me = document.createElement('span'); me.className = 'tag me'; me.textContent = 'ห้องของคุณ'; meta.append(me); }
    if (!r.private){ const c = document.createElement('span'); c.textContent = 'รหัส ' + r.code; meta.append(c); }
    main.append(nm, meta);

    const act = document.createElement('div'); act.className = 'r-act';
    const go = document.createElement('button'); go.className = 'btn primary';
    const myKey = CODE_RE.test(keys[r.code]) ? keys[r.code] : null;   // รหัสห้องส่วนตัวที่เคยเข้าสำเร็จ
    go.textContent = full ? 'เต็มแล้ว' : (r.private && !myKey ? 'ใส่รหัสผ่าน' : 'เข้าห้อง');
    go.disabled = full;
    act.append(go);
    let keyRow = null;
    if (r.private && !myKey){
      keyRow = document.createElement('form'); keyRow.className = 'r-key'; keyRow.hidden = !(r.code in st.openKey);
      const inp = document.createElement('input'); inp.className = 'input code-in'; inp.maxLength = 6; inp.placeholder = 'รหัสผ่าน 6 ตัว';
      inp.autocapitalize = 'characters'; inp.spellcheck = false; inp.value = st.openKey[r.code] || '';
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6); st.openKey[r.code] = inp.value; });
      const ok = document.createElement('button'); ok.className = 'btn'; ok.type = 'submit'; ok.textContent = 'เข้า';
      keyRow.append(inp, ok);
      keyRow.addEventListener('submit', e => {
        e.preventDefault();
        if (!CODE_RE.test(inp.value)){ showMsg('รหัสผ่านต้องมี 6 ตัว'); return; }
        location.href = `draw.html?room=${r.code}&key=${inp.value}`;
      });
      go.addEventListener('click', () => {
        if (r.code in st.openKey){ delete st.openKey[r.code]; } else st.openKey[r.code] = '';
        render(); const f = document.querySelector(`[data-key-for="${r.code}"] input`); if (f) f.focus();
      });
      keyRow.dataset.keyFor = r.code;
    } else {
      go.addEventListener('click', () => { location.href = `draw.html?room=${r.code}` + (r.private && myKey ? `&key=${myKey}` : ''); });
    }
    if (mine){
      const del = document.createElement('button'); del.className = 'btn danger';
      const confirming = st.confirmDel === r.code;
      del.textContent = confirming ? 'ยืนยันลบ' : 'ลบห้อง';
      if (confirming) del.classList.add('confirm');
      del.addEventListener('click', async () => {
        if (st.confirmDel !== r.code){
          st.confirmDel = r.code; render();
          setTimeout(() => { if (st.confirmDel === r.code){ st.confirmDel = null; render(); } }, 3000);
          return;
        }
        st.confirmDel = null; del.disabled = true; del.textContent = 'กำลังลบ';
        try { await deleteRoom(r.code); showMsg(null); } catch (err) { console.warn(err); showMsg(errKey(err)); render(); }
      });
      act.append(del);
    }
    el.append(main, act);
    if (keyRow) el.append(keyRow);
    list.append(el);
  }
  if (focusKey){ const f = list.querySelector(`[data-key-for="${focusKey}"] input`); if (f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  const empty = $('#empty');
  empty.hidden = shown.length > 0;
  $('#emptyText').textContent = all.length === 0 ? 'ยังไม่มีห้องที่เปิดอยู่' : 'ไม่มีห้องในหมวดนี้';
  $('#emptyCreate').hidden = all.length > 0;
}

/* ---------- สร้างห้อง ---------- */
async function createRoom(){
  const fb = await ensureFirebase();
  const name = $('#nameInput').value.replace(/\s+/g, ' ').trim().slice(0, 30) || 'ห้องวาดเล่น';
  const priv = st.vis === 'private';
  for (let i = 0; i < 6; i++){
    const code = genCode();
    if ((await fb.get(R(`rooms/${code}/meta`))).exists()) continue;
    const TS = fb.serverTimestamp(), upd = {};
    upd[`rooms/${code}/meta`] = {createdAt:TS, owner:st.uid, name, private:priv};
    upd[`lobby/${code}`] = {createdAt:TS, owner:st.uid, name, private:priv};
    let key = null;
    if (priv){
      key = genCode();
      upd[`secrets/${code}`] = key;
      upd[`rooms/${code}/keys/${st.uid}`] = key;
    }
    await fb.update(R('/'), upd);
    if (key) saveKey(code, key);
    location.href = `draw.html?room=${code}` + (key ? `&key=${key}` : '');
    return;
  }
  throw {code:'busy'};
}

/* ---------- UI ---------- */
document.querySelectorAll('#vis button').forEach(b => b.addEventListener('click', () => {
  st.vis = b.dataset.vis;
  document.querySelectorAll('#vis button').forEach(x => x.classList.toggle('on', x === b));
  $('#visNote').textContent = st.vis === 'private'
    ? 'คนอื่นเห็นชื่อห้อง แต่ต้องมีรหัสผ่านถึงจะเข้าได้ ระบบสุ่มรหัสผ่านให้'
    : 'ทุกคนเห็นในรายการและกดเข้าได้ทันที';
}));
document.querySelectorAll('#filter button').forEach(b => b.addEventListener('click', () => {
  st.filter = b.dataset.f;
  document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('on', x === b));
  render();
}));
$('#openCreate').addEventListener('click', openCreate);
$('#emptyCreate').addEventListener('click', openCreate);
$('#closeCreate').addEventListener('click', closeCreate);
$('#createModal').addEventListener('click', e => { if (e.target.id === 'createModal') closeCreate(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeCreate(); });
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#createBtn').click(); });
$('#createBtn').addEventListener('click', async () => {
  if (st.busy) return;
  st.busy = true; showMsg(null, '#createMsg');
  const b = $('#createBtn'); b.disabled = true; b.textContent = 'กำลังสร้างห้อง';
  try { await createRoom(); }
  catch (err) { console.warn(err); showMsg(errKey(err), '#createMsg'); b.disabled = false; b.textContent = 'สร้างห้อง'; }
  finally { st.busy = false; }
});
$('#codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6); });
$('#joinForm').addEventListener('submit', e => {
  e.preventDefault();
  const code = $('#codeInput').value;
  if (!CODE_RE.test(code)){ showMsg('bad-code'); return; }
  location.href = 'draw.html?room=' + code;
});

// โลโก้และภาพในแบนเนอร์ขยับแบบเดียวกับเส้นบนกระดาน
const logo = $('#logoLine');
const frames = ['M9 27 C14 15, 19 31, 23 21 S31 12, 35 19','M9 26 C15 16, 18 30, 23 22 S30 13, 35 18','M10 27 C14 14, 20 30, 22 21 S31 11, 34 19'];
const wobble = (pts, amp) => pts.map(([x, y]) => [x + (Math.random() - .5) * amp, y + (Math.random() - .5) * amp]);
function curve(p){
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for (let i = 1; i < p.length - 1; i++){ const mx = (p[i][0] + p[i+1][0]) / 2, my = (p[i][1] + p[i+1][1]) / 2; d += ` Q${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`; }
  const l = p[p.length-1]; return d + ` L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;
}
const pencilBase = Array.from({length:14}, (_, i) => [40 + i*20, 78 + Math.sin(i / 2) * 18]);   // ดินสอยุกยิก
const pixelBase = Array.from({length:22}, (_, i) => [44 + i*12, 128 + Math.round(Math.sin(i / 3) * 2) * 10]);   // เส้นพิกเซล
let frame = 0;
function drawArt(){
  $('#artPencil').setAttribute('d', curve(wobble(pencilBase, 4)));
  $('#artPencil2').setAttribute('d', curve(wobble(pencilBase, 6)));
  $('#artPixel').innerHTML = wobble(pixelBase, 5).map(([x, y]) => `<rect x="${Math.round(x/6)*6}" y="${Math.round(y/6)*6}" width="12" height="12"/>`).join('');
  let d = ''; const ph = frame * .6;   // เส้นหยัก: หยักวิ่งไปเรื่อย ๆ
  for (let x = 40; x <= 320; x += 2){ const y = 192 + Math.asin(Math.sin(x / 7 - ph)) * 7 + Math.sin(x / 40) * 6; d += (x === 40 ? 'M' : 'L') + x + ' ' + y.toFixed(1); }
  $('#artWave').setAttribute('d', d);
}
let li = 0; setInterval(() => { li = (li + 1) % 3; logo.setAttribute('d', frames[li]); frame++; drawArt(); }, 120);
drawArt();

/* ---------- เริ่ม ---------- */
(async () => {
  if (!fbConfig()){
    showMsg('no-config'); $('#list').textContent = '';
    $('#createBtn').disabled = true;
    $('#empty').hidden = false; $('#emptyText').textContent = 'ยังดูรายการห้องไม่ได้ ระหว่างนี้กด “เริ่มวาดเลย” ได้ก่อน'; $('#emptyCreate').hidden = true;
    return;
  }
  try { await ensureFirebase(); watchList(); }
  catch (err) { console.warn(err); showMsg(errKey(err)); $('#list').textContent = ''; }
  setInterval(() => { cleanup(); render(); }, 30000);   // อัปเดตเวลานับถอยหลัง
})();
})();
</script>
