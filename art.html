<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<meta name="description" content="รูปจากวาดเล่น เส้นขยับได้เอง กดวาดต่อจากรูปนี้ได้">
<title>ดูรูป | วาดเล่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/shared.css">
<link rel="stylesheet" href="styles/lobby.css">
<link rel="stylesheet" href="styles/art.css">
</head>
<body class="viewer">
<header class="vtop">
  <a class="btn icon" href="gallery.html" aria-label="กลับไปแกลเลอรี่" title="กลับไปแกลเลอรี่"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></a>
  <div class="vinfo">
    <div class="vtitle" id="vTitle" translate="no"></div>
    <div class="vby" id="vBy" translate="no"></div>
    <a class="vfrom" id="vFrom" hidden>วาดต่อจากรูปนี้</a>
  </div>
  <div class="lang-slot"></div>
</header>
<main class="stage" id="stage">
  <canvas id="paper"></canvas>
  <canvas id="ink"></canvas>
  <div id="empty" hidden></div>
  <div class="vmsg" id="vMsg" hidden><div id="vMsgText"></div><a class="btn" href="gallery.html">ไปแกลเลอรี่</a></div>
</main>
<footer class="vbar" id="vBar" hidden>
  <button class="heart" id="vLike" hidden aria-label="กดหัวใจ"></button>
  <button class="btn icon" id="vPlay" aria-label="หยุดเส้น" title="หยุดเส้น"></button>
  <button class="btn" id="vCopy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.3-2.3a3 3 0 0 0-4.2-4.2L8 3.8M9.5 6.5a3 3 0 0 0-4.2 0L3 8.8A3 3 0 0 0 7.2 13l.8-.8"/></svg><span>คัดลอกลิงก์</span></button>
  <a class="btn primary pop" id="vRemix"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></svg><span>วาดต่อ</span></a>
  <div class="vmore">
    <button class="btn icon" id="vMoreBtn" aria-label="เพิ่มเติม" title="เพิ่มเติม" aria-expanded="false"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg></button>
    <div class="vmenu" id="vMenu" hidden>
      <button id="vReport">รายงานรูปไม่เหมาะสม</button>
      <button id="vDelete" class="danger" hidden>ลบรูปนี้</button>
    </div>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>
<script src="firebase-config.js"></script>
<script type="module" src="dist/art/main.js"></script>
</body>
</html>
