# ทุกครั้งที่อัปโค้ดขึ้น main: แปลง TypeScript เป็น JavaScript แล้วขึ้นเว็บที่ GitHub Pages ให้เอง
name: ขึ้นเว็บ GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ติดตั้ง TypeScript
        run: npm install --no-audit --no-fund
      - name: ตรวจโค้ดและแปลงเป็น JavaScript
        run: npm run build
      - name: รวมไฟล์ของเว็บ
        run: |
          mkdir _site
          cp -r index.html draw.html gallery.html art.html firebase-config.js styles dist _site/
          # ใส่เลขเวอร์ชันท้ายไฟล์ เบราว์เซอร์จะได้ไม่ใช้ไฟล์เก่าที่จำไว้
          V=${GITHUB_SHA::8}
          find _site/dist -name '*.js' -exec sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$V'#g; s#(import '\.\./[^']+\.js)'#\1?v=$V'#g; s#(from '\.\./[^']+\.js)'#\1?v=$V'#g" {} +
          sed -i -E "s#(src=\"dist/[^\"]+\.js)\"#\1?v=$V\"#; s#(href=\"styles/[^\"]+\.css)\"#\1?v=$V\"#g; s#(src=\"firebase-config\.js)\"#\1?v=$V\"#" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
